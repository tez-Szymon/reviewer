name: Release

# Pushing a version tag (v0.4.0, or v0.4.0-beta.1 for a pre-release) builds the installers and update packages for
# each runtime and publishes them as one GitHub release, which installed apps update from. Signing uses the secrets
# below when they're set; without them the packages are built unsigned. Updates are full packages (no deltas).
# See docs/RELEASING.md.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  package:
    name: Package (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: macos-latest, rid: osx-arm64 }
          - { os: macos-latest, rid: osx-x64 }
          - { os: windows-latest, rid: win-x64 }
    defaults:
      run:
        shell: bash
    env:
      # Secrets can't be read in a step's condition; whether they're set can.
      HAS_MACOS_SIGNING: ${{ secrets.MACOS_CERTIFICATES_P12 != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Version and release notes
        run: |
          tag="${GITHUB_REF_NAME}"
          echo "VERSION=${tag#v}" >> "$GITHUB_ENV"
          # The checkout has the commit, not the annotated tag; its message is the release notes.
          git fetch --force origin "refs/tags/$tag:refs/tags/$tag"
          git tag -l --format='%(contents)' "$tag" > "$RUNNER_TEMP/notes.md"
          echo "RELEASE_NOTES=$RUNNER_TEMP/notes.md" >> "$GITHUB_ENV"

      - name: Test
        run: dotnet test Reviewer.slnx --configuration Release

      - name: Tools
        run: dotnet tool restore

      - name: Signing keychain (macOS)
        if: runner.os == 'macOS' && env.HAS_MACOS_SIGNING == 'true'
        env:
          MACOS_CERTIFICATES_P12: ${{ secrets.MACOS_CERTIFICATES_P12 }}
          MACOS_CERTIFICATES_PASSWORD: ${{ secrets.MACOS_CERTIFICATES_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$MACOS_CERTIFICATES_P12" | base64 --decode > "$RUNNER_TEMP/certificates.p12"
          security import "$RUNNER_TEMP/certificates.p12" -k "$keychain" -P "$MACOS_CERTIFICATES_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productsign -T /usr/bin/pkgbuild
          rm "$RUNNER_TEMP/certificates.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          xcrun notarytool store-credentials reviewer --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --keychain "$keychain"
          echo "MACOS_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "MACOS_NOTARY_PROFILE=reviewer" >> "$GITHUB_ENV"

      - name: Package
        env:
          MACOS_SIGN_APP_IDENTITY: ${{ env.MACOS_KEYCHAIN != '' && secrets.MACOS_SIGN_APP_IDENTITY || '' }}
          MACOS_SIGN_INSTALL_IDENTITY: ${{ secrets.MACOS_SIGN_INSTALL_IDENTITY }}
          WINDOWS_SIGN_TEMPLATE: ${{ secrets.WINDOWS_SIGN_TEMPLATE }}
        run: eng/package.sh "$VERSION" "${{ matrix.rid }}"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.rid }}
          path: artifacts/releases/${{ matrix.rid }}
          if-no-files-found: error

  publish:
    name: Publish
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Tools
        run: dotnet tool restore

      - uses: actions/download-artifact@v4
        with:
          path: artifacts/releases
          pattern: release-*

      # One release for the tag, each runtime's channel merged into it. A tag with a suffix (v0.4.0-beta.1) is a
      # pre-release, which installed apps don't update to.
      - name: Upload to GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pre=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && pre=(--pre)
          for dir in artifacts/releases/release-*; do
            rid="${dir##*/release-}"
            dotnet vpk upload github --repoUrl "https://github.com/${GITHUB_REPOSITORY}" --token "$GITHUB_TOKEN" \
              --channel "$rid" --outputDir "$dir" --tag "$GITHUB_REF_NAME" --releaseName "Reviewer ${GITHUB_REF_NAME#v}" \
              --merge --publish "${pre[@]}"
          done

      # vpk uploads only the files it built; the macOS disk images go up beside them.
      - name: Upload disk images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" artifacts/releases/release-*/*.dmg --clobber --repo "$GITHUB_REPOSITORY"
