bugs:
  - file: src/Reviewer.Engine/ReviewRunner.cs
    lines: 151-153
    about: Reported findings are filtered against dismissed open findings, but once a review records the dismissal the finding is no longer open, so a later review (--full, say) that reports it again lets it block. It should check the resolved threads on the PR.
