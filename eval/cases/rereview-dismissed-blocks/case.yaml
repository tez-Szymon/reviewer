# A real change from this repo: 749baef, fixed later in ae29f38.
title: Resolve fixed findings' threads, and honour threads people resolve
description: |
  After a published re-review, each fixed finding's thread gets a reply and is resolved. A finding whose thread a
  person resolved is dismissed: it stops blocking, even if the agent reports it again, isn't posted again, and is
  marked resolved in the database.
repo: https://github.com/tez-Szymon/reviewer.git
